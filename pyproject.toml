[project]
name = "cua-bank-automation"
version = "0.1.0"
description = "Computer-use automation for legacy banking UIs: LLM discovery -> typed capability artifact -> deterministic replay, with HITL escalation and guardrails."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cua = "cua.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cua*", "mock_bank*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
